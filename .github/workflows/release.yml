name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v0.1.1)'
        required: true
        default: ''

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # 模型文件名（作为 Release asset 上传）
  MODEL_FILENAME: multilingual-e5-base-q8_0.gguf

jobs:
  build-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        run: brew install protobuf

      - name: Build
        run: cargo build --release --target aarch64-apple-darwin

      - name: Create .app bundle
        run: bash scripts/macos_bundle.sh
        env:
          TARGET_DIR: target/aarch64-apple-darwin/release

      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "XEChat" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 400 200 \
            "XEChat-macos-arm64.dmg" \
            "$TARGET_DIR/XEChat.app"
        env:
          TARGET_DIR: target/aarch64-apple-darwin/release

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: xechat-macos-arm64
          path: XEChat-macos-arm64.dmg

  build-macos-x86_64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        run: brew install protobuf

      - name: Create cc wrapper to reject AVX-512 compilation
        run: |
          cat > /tmp/cc-no-avx512.sh << 'SCRIPT'
          #!/bin/bash
          # lance-linalg build.rs 无条件编译 AVX-512 dist_table 内核（C 代码），
          # 但 dist_table.c 用 #ifdef __AVX512BW__ 守卫，过滤标志后函数体不会生成，
          # try_compile 仍返回 Ok → cfg 被设置 → Rust 引用不存在的符号 → 链接失败。
          # 解决方案：检测到 AVX-512 标志时直接让编译失败，
          # 这样 try_compile 返回 Err，cfg 不设置，Rust 代码走 fallback。
          for arg in "$@"; do
            case "$arg" in
              -march=sapphirerapids|-mavx512fp16|-mavx512bw|-mavx512f|-mavx512dq|-mavx512cd|-mavx512vl)
                echo "cc-wrapper: rejecting AVX-512 flag: $arg" >&2
                exit 1
                ;;
            esac
          done
          exec cc "$@"
          SCRIPT
          chmod +x /tmp/cc-no-avx512.sh

      - name: Build
        run: cargo build --release --target x86_64-apple-darwin
        env:
          # 交叉编译时禁用 AVX-512，避免 lance-linalg 链接失败
          RUSTFLAGS: "-C target-feature=-avx512f,-avx512bw,-avx512cd,-avx512dq,-avx512vl"
          # 用 cc wrapper 过滤 AVX-512 C 编译标志
          CC_x86_64_apple_darwin: /tmp/cc-no-avx512.sh

      - name: Create .app bundle
        run: bash scripts/macos_bundle.sh
        env:
          TARGET_DIR: target/x86_64-apple-darwin/release

      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "XEChat" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 400 200 \
            "XEChat-macos-x86_64.dmg" \
            "$TARGET_DIR/XEChat.app"
        env:
          TARGET_DIR: target/x86_64-apple-darwin/release

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: xechat-macos-x86_64
          path: XEChat-macos-x86_64.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Package
        run: bash scripts/linux_bundle.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: xechat-linux-x86_64
          path: target/release/XEChat-linux-x86_64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        shell: pwsh
        run: |
          $protocVersion = "29.5"
          $url = "https://github.com/protocolbuffers/protobuf/releases/download/v$protocVersion/protoc-$protocVersion-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile protoc.zip
          Expand-Archive -Path protoc.zip -DestinationPath C:\protoc
          echo "C:\protoc\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build
        run: cargo build --release

      - name: Package zip
        shell: pwsh
        run: |
          mkdir XEChat-windows
          Copy-Item target/release/xechat.exe XEChat-windows/XEChat.exe
          if (Test-Path assets/icons/icon.ico) {
            Copy-Item assets/icons/icon.ico XEChat-windows/icon.ico
          }
          Compress-Archive -Path XEChat-windows -DestinationPath XEChat-windows-x86_64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: xechat-windows-x86_64
          path: XEChat-windows-x86_64.zip

  release:
    needs: [build-macos-arm64, build-macos-x86_64, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Determine tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "name=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: XEChat ${{ steps.tag.outputs.name }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }}
          files: |
            artifacts/xechat-macos-arm64/XEChat-macos-arm64.dmg
            artifacts/xechat-macos-x86_64/XEChat-macos-x86_64.dmg
            artifacts/xechat-linux-x86_64/XEChat-linux-x86_64.tar.gz
            artifacts/xechat-windows-x86_64/XEChat-windows-x86_64.zip
          body: |
            ## XEChat ${{ steps.tag.outputs.name }}

            ### 下载

            | 平台 | 文件 |
            |------|------|
            | macOS (Apple Silicon) | `XEChat-macos-arm64.dmg` |
            | macOS (Intel) | `XEChat-macos-x86_64.dmg` |
            | Linux (x86_64) | `XEChat-linux-x86_64.tar.gz` |
            | Windows (x86_64) | `XEChat-windows-x86_64.zip` |

            ### 嵌入模型

            首次使用内置嵌入功能时，应用会自动从 Release 附件下载 E5 模型文件（约 430MB）。
            也可在设置页面手动触发下载。

            ### 系统要求

            - macOS 10.15+
            - Linux: libwebkit2gtk-4.1
            - Windows 10+ with WebView2 Runtime
