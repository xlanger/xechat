[dependencies]
dioxus = { version = "0.7", features = ["desktop"] }
image = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1.0", features = ["v4", "serde"] }
toml = "0.8"
dirs = "5"
regex = "1.10"
comrak = { version = "0.52", features = ["syntect"] }
katex = { version = "0.4", default-features = false, features = ["duktape"] }
lazy_static = "1"
mermaid-rs-renderer = { version = "0.2", default-features = false }
once_cell = "1"
tokio-stream = "0.1"
base64 = "0.22"
dioxus_style = { path = "crates/dioxus-style" }
rust-i18n = "3"

# 向量数据库
lancedb = "0.30"
arrow-array = "58"
arrow-schema = "58"

# GGUF 推理（E5 嵌入）— embellama 封装 llama-cpp-2
embellama = "0.10"

# 错误处理
anyhow = "1"
async-trait = "0.1.89"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Globalization"] }

[dev-dependencies]
mockall = "0.13"
tempfile = "3"
pretty_assertions = "1"
serial_test = "3"

[build-dependencies]
grass = "0.13"

