[workspace]
members = ["crates/dioxus-style", "crates/dioxus-style-macro"]
resolver = "2"

[package]
name = "xechat"
version = "0.1.5"
description = "XEChat - Desktop AI Chat Client"
authors = ["xlanger"]
edition = "2024"
license = "MIT"
repository = "https://github.com/xlanger/xechat"
readme = "README.md"
keywords = ["chat", "ai", "llm", "dioxus", "desktop"]
categories = ["gui", "applications"]

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "xechat"
path = "src/main.rs"

